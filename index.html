<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Partnerships — Woosong University IR</title>
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f2;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd5;--text:#1a1814;--muted:#7a7368;--faint:#c5c0b8;--active:#16a34a;--sol:#1a56db;--woo:#0f9b6e;--main:#c85a0a}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:14px;min-height:100vh}
.hdr{padding:2.5rem 2.5rem 1.75rem;border-bottom:1.5px solid var(--border);background:var(--surface);display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hdr-left{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--active);font-weight:600;display:flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--active);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.hdr h1{font-family:'Cabinet Grotesk',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hdr p{color:var(--muted);font-size:13px}
.hdr-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.unique-box{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:14px 22px;text-align:center;min-width:140px}
.unique-box .ub-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:4px}
.unique-box .ub-val{font-family:'Cabinet Grotesk',sans-serif;font-size:2.4rem;font-weight:800;line-height:1;color:#0f9b6e}
.hdr-badges{display:flex;gap:8px;flex-wrap:wrap}
.cbadge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:4px;border:1.5px solid}
.cb-sol{color:var(--sol);border-color:rgba(26,86,219,.25);background:rgba(26,86,219,.06)}
.cb-woo{color:var(--woo);border-color:rgba(15,155,110,.25);background:rgba(15,155,110,.06)}
.cb-main{color:var(--main);border-color:rgba(200,90,10,.25);background:rgba(200,90,10,.06)}
.cdot{width:7px;height:7px;border-radius:50%}
.nav{background:var(--surface);border-bottom:1.5px solid var(--border);padding:0 2.5rem;display:flex;gap:0;overflow-x:auto}
.nav-btn{padding:.9rem 1.1rem;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .15s;margin-bottom:-1.5px}
.nav-btn:hover{color:var(--text)}.nav-btn.active{color:var(--text);border-bottom-color:var(--text)}
.nb{font-size:10px;background:var(--surface2);border-radius:3px;padding:1px 5px;margin-left:4px;color:var(--faint)}
.nav-btn.active .nb{background:var(--text);color:#fff}
.page{display:none}.page.active{display:block}
.section{padding:2rem 2.5rem;border-bottom:1.5px solid var(--border)}
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.sec-hdr h2{font-family:'Cabinet Grotesk',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.sec-hdr .sub{font-size:12px;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.stat{background:var(--surface);padding:1rem 1.25rem}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.stat .val{font-family:'Cabinet Grotesk',sans-serif;font-size:1.6rem;font-weight:800;line-height:1}
.stat .bd{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.stat .bdi{font-size:11px;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid var(--border)}
.stat .bdi:last-child{border-bottom:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:1.25rem}
.ctitle{font-family:'Cabinet Grotesk',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:1rem}
.cw-lg{position:relative;width:100%;height:380px}.cw{position:relative;width:100%;height:280px}.cw-sm{position:relative;width:100%;height:200px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.tab-strip{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:1.25rem;border-bottom:1.5px solid var(--border);padding-bottom:.75rem;scrollbar-width:none;-ms-overflow-style:none}
.tab-strip::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:4px;border:1.5px solid transparent;background:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{background:var(--surface2);color:var(--text)}.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.tc{background:rgba(255,255,255,.2);border-radius:3px;padding:1px 5px;font-size:10px;margin-left:4px}
.tab:not(.active) .tc{background:var(--surface2);color:var(--faint)}
.rg{display:grid;grid-template-columns:190px 1fr 1fr;gap:1rem;align-items:start}
.cr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:6px;margin-bottom:6px}
.cn{flex:1;font-size:13px;font-weight:600}.cv{font-family:'Cabinet Grotesk',sans-serif;font-size:1.1rem;font-weight:800}.cp{font-size:11px;color:var(--muted)}
.ctry-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.ctry-row:last-child{border-bottom:none}
.ctry-nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.ctry-bars{display:flex;gap:3px;align-items:center;width:90px;flex-shrink:0}
.cbs{height:8px;border-radius:2px;min-width:2px;flex-shrink:0}
.ctry-tot{font-family:'Cabinet Grotesk',sans-serif;font-size:12px;font-weight:700;width:24px;text-align:right;flex-shrink:0}
.dir-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}
.dir-in{background:rgba(26,86,219,.1);color:#1a56db}.dir-out{background:rgba(200,90,10,.1);color:#c85a0a}
.dir-rec{background:rgba(15,155,110,.1);color:#0f9b6e}.dir-uns{background:rgba(122,115,104,.1);color:#7a7368}
.type-layout{display:grid;grid-template-columns:220px 1fr;gap:1.5rem;align-items:start}
.region-list-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.rl-row{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.rl-row:last-child{border-bottom:none}.rl-row:hover{background:var(--surface2)}.rl-row.active{background:var(--text)}
.rl-row .rl-name{flex:1;font-size:13px;font-weight:600}.rl-row.active .rl-name{color:#fff}
.rl-row .rl-n{font-family:'Cabinet Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--muted)}.rl-row.active .rl-n{color:rgba(255,255,255,.7)}
.rl-bar-wrap{width:50px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}.rl-bar{height:100%;border-radius:3px}
.rl-row.active .rl-bar-wrap{background:rgba(255,255,255,.2)}
.type-detail-panel{display:flex;flex-direction:column;gap:1rem}
.type-detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.yr-tabs{display:flex;gap:6px;margin-bottom:1.25rem}
.ytab{padding:6px 20px;border-radius:4px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--muted);transition:all .15s}
.ytab.active{background:var(--text);color:#fff;border-color:var(--text)}.ytab:hover:not(.active){background:var(--surface2);color:var(--text)}
.yg{display:grid;grid-template-columns:180px 1fr 1fr;gap:1rem;align-items:start}
.search-wrap{padding:2rem 2.5rem 3rem}
.search-bar-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:flex-end}
.sf{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
.sf label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sf input,.sf select{height:38px;border:1.5px solid var(--border);border-radius:6px;padding:0 12px;font-family:'Instrument Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s}
.sf input:focus,.sf select:focus{border-color:#1a56db}
.clear-btn{height:38px;padding:0 14px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:6px;font-family:'Instrument Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;align-self:flex-end}
.clear-btn:hover{background:var(--surface2);color:var(--text)}
.results-meta{font-size:13px;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.results-meta strong{color:var(--text)}
.results-table-wrap{overflow-x:auto;border:1.5px solid var(--border);border-radius:8px}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--border);white-space:nowrap}
table.rt td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.rt tr:last-child td{border-bottom:none}
table.rt tr:hover td{background:var(--surface2)}
.type-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.camp-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.cdot-sm{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.date-val{font-size:12px;color:var(--muted)}
.no-results{text-align:center;padding:3rem 2rem;color:var(--muted)}
.pagination{display:flex;align-items:center;gap:6px;margin-top:1.25rem;flex-wrap:wrap}
.pg-btn{height:32px;min-width:32px;padding:0 8px;border:1.5px solid var(--border);background:var(--surface);border-radius:4px;cursor:pointer;font-family:'Cabinet Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s}
.pg-btn:hover{background:var(--surface2);color:var(--text)}.pg-btn.active{background:var(--text);color:#fff;border-color:var(--text)}.pg-btn:disabled{opacity:.35;cursor:not-allowed}
.sort-hdr{cursor:pointer;user-select:none}.sort-hdr:hover{color:var(--text)}.sort-arrow{margin-left:4px;font-size:10px}
@media(max-width:900px){.two-col,.rg,.yg,.type-layout,.type-detail-inner{grid-template-columns:1fr}}

/* ── REPORT GENERATOR ── */
.rpt-wrap{padding:2rem 2.5rem 3rem}
.rpt-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.rpt-card-sel{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem;cursor:pointer;transition:all .15s;position:relative}
.rpt-card-sel:hover{border-color:var(--text);background:var(--surface2)}
.rpt-card-sel.active{border-color:var(--text);background:var(--text)}
.rpt-card-sel.active .rcs-title{color:#fff}
.rpt-card-sel.active .rcs-desc{color:rgba(255,255,255,.6)}
.rcs-icon{font-size:1.4rem;margin-bottom:8px}
.rcs-title{font-family:'Cabinet Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px}
.rcs-desc{font-size:11px;color:var(--muted);line-height:1.4}
.rpt-options-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:1.25rem 1.5rem;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;margin-bottom:1.5rem}
.rpt-opt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.rpt-opt label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.rpt-opt select,.rpt-opt input{height:34px;border:1.5px solid var(--border);border-radius:5px;padding:0 10px;font-family:'Instrument Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.rpt-opt select:focus,.rpt-opt input:focus{border-color:var(--text)}
.gen-btn{height:34px;padding:0 20px;background:var(--text);color:#fff;border:none;border-radius:5px;font-family:'Cabinet Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap;align-self:flex-end}
.gen-btn:hover{opacity:.85}
.print-btn{height:34px;padding:0 16px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:5px;font-family:'Instrument Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;align-self:flex-end}
.print-btn:hover{background:var(--surface2);color:var(--text)}
.rpt-preview{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.rpt-preview-hdr{padding:1.25rem 1.5rem;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.rpt-preview-hdr h3{font-family:'Cabinet Grotesk',sans-serif;font-size:1rem;font-weight:700}
.rpt-preview-hdr .rph-meta{font-size:12px;color:var(--muted)}
.rpt-body{padding:1.5rem}
.rpt-section{margin-bottom:2rem}
.rpt-section:last-child{margin-bottom:0}
.rpt-section-title{font-family:'Cabinet Grotesk',sans-serif;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.rpt-kpi-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.rpt-kpi{flex:1;min-width:100px;background:var(--surface2);border-radius:6px;padding:.85rem 1rem}
.rpt-kpi .kv{font-family:'Cabinet Grotesk',sans-serif;font-size:1.8rem;font-weight:800;line-height:1}
.rpt-kpi .kl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.rpt-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rpt-table th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--border);white-space:nowrap}
.rpt-table td{padding:7px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.rpt-table tr:last-child td{border-bottom:none}
.rpt-table tr:hover td{background:var(--surface2)}
.rpt-table .num{font-family:'Cabinet Grotesk',sans-serif;font-weight:700;text-align:right}
.rpt-bar-cell{display:flex;align-items:center;gap:6px}
.rpt-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:60px}
.rpt-bar-fill{height:100%;border-radius:3px}
.exp-badge{display:inline-flex;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600}
.exp-urgent{background:rgba(220,38,38,.1);color:#dc2626}
.exp-soon{background:rgba(234,179,8,.1);color:#ca8a04}
.exp-ok{background:rgba(22,163,74,.1);color:#16a34a}
.exp-indef{background:rgba(8,145,178,.1);color:#0891b2}
.rpt-empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
/* report generator styles end */
/* ── CHIP FILTER PANEL ── */
.gf-panel{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;margin-bottom:1rem;overflow:hidden}
.gf-panel-hdr{padding:.65rem 1.25rem;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.gf-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;border-top:none}
.gf-col{padding:1rem 1.25rem;border-right:1px solid var(--border)}
.gf-col:last-child{border-right:none}
.gf-col-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:.6rem}
.gf-chips{display:flex;flex-wrap:wrap;gap:5px}
.gf-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .12s;user-select:none;white-space:nowrap}
.gf-chip:hover{border-color:var(--text);color:var(--text);background:var(--surface2)}
.gf-chip.sel{background:var(--text);color:#fff;border-color:var(--text)}
.gf-country-wrap{max-height:180px;overflow-y:auto;padding-right:2px}
.gf-country-search{width:100%;height:28px;border:1.5px solid var(--border);border-radius:4px;padding:0 8px;font-family:inherit;font-size:12px;margin-bottom:6px;background:var(--surface);color:var(--text);outline:none}
.gf-country-search:focus{border-color:var(--text)}
.gf-clear-btn{font-size:11px;padding:3px 10px;border:1.5px solid var(--border);border-radius:4px;background:none;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .12s}
.gf-clear-btn:hover{background:var(--surface2);color:var(--text)}
/* ── Link to China Team MOU Dashboard ── */
.cn-link{display:flex;align-items:center;gap:12px;padding:12px 18px;border:1.5px solid rgba(200,16,46,.3);border-radius:10px;background:rgba(200,16,46,.05);color:var(--text);text-decoration:none;transition:background .15s,border-color .15s}
.cn-link:hover{background:rgba(200,16,46,.1);border-color:rgba(200,16,46,.55)}
.cn-link:focus-visible{outline:2px solid #c8102e;outline-offset:2px}
.cn-link .cn-flag{font-size:1.5rem;line-height:1}
.cn-link .cn-txt{display:flex;flex-direction:column;gap:2px}
.cn-link .cn-t1{font-family:'Cabinet Grotesk',sans-serif;font-size:14px;font-weight:700;color:#c8102e}
.cn-link .cn-t2{font-size:11px;color:var(--muted)}
.cn-link .cn-arrow{font-size:16px;color:#c8102e;margin-left:4px}
@media(max-width:600px){.hdr{padding:1.5rem 1.25rem 1.25rem}.cn-link{width:100%}}
#syncPill{display:inline-flex;align-self:flex-start;justify-self:start;width:max-content!important;max-width:100%;align-items:center;gap:7px;margin:0 0 6px;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;font-family:inherit;font-weight:600;font-size:12px;line-height:1;color:#7a7368;cursor:pointer}
#syncPill .sp-dot{width:7px;height:7px;border-radius:50%;background:#c9c3b8}
#syncPill[data-state=ok] .sp-dot{background:#0f9b6e;animation:spPulse 2.4s ease-in-out infinite}
#syncPill[data-state=warn]{color:#92400e;border-color:#fcd34d;background:#fffbeb}#syncPill[data-state=warn] .sp-dot{background:#f59e0b}
#syncPill[data-state=bad]{color:#991b1b;border-color:#fecaca;background:#fff1f2}#syncPill[data-state=bad] .sp-dot{background:#dc2626}
@keyframes spPulse{0%,100%{opacity:1}50%{opacity:.35}}@media (prefers-reduced-motion:reduce){#syncPill .sp-dot{animation:none}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="eyebrow"><span class="pulse"></span>Active MOUs only &middot; Woosong University IR</div>
    <h1>Active Partnerships</h1>
    <div style="display:flex"><button id="syncPill" type="button" onclick="syncPillClick()" style="display:none"><span class="sp-dot"></span><span></span></button></div>
    <p id="hdr-sub">Active MOU database &mdash; regions, types &amp; signed year analysis</p>
  </div>
  <div class="hdr-right">

const CS=['SolBridge','Woosong','Main Campus'];
const ctObj=o=>CS.reduce((s,k)=>s+(o&&o[k]||0),0);
const inc=(o,k,v=1)=>{o[k]=(o[k]||0)+v;};

/* ── NORMALIZERS (were missing — the live path could never run without them) ── */
function normCampus(v){
  const s=String(v||'').trim().toLowerCase();
  if(!s)return null;
  if(s.includes('sol'))return 'SolBridge';
  if(s.includes('main'))return 'Main Campus';
  if(s.includes('woosong'))return 'Woosong';
  return null;
}
function normType(raw){
  const s=String(raw||'').toLowerCase();
  if(/\btransfer\b/.test(s))return 'Transfer';
  if(/idegree/.test(s))return 'iDegree';
  if(/study abroad/.test(s))return 'Study Abroad';
  if(/dual degree/.test(s))return 'Dual Degree';
  if(/\d(\.\d)?\s*\+\s*\d/.test(s)&&!/post graduate/.test(s))return 'Dual Degree';
  if(/\bexchange\b/.test(s))return 'Exchange';
  if(/\bgeneral\b/.test(s))return 'General';
  return 'Other';
}
function normDir(raw){
  const s=String(raw||'').toLowerCase();
  if(/\breciprocal\b/.test(s))return 'Reciprocal';
  if(/\binbound\b/.test(s))return 'Inbound';
  if(/\boutbound\b/.test(s))return 'Outbound';
  return 'Unspecified';
}
function normExp(ed){return /indefinite/i.test(String(ed||''))?'Indefinite':'Ongoing'}
function csvParse(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}

function crunch(allRows){
  // allRows includes header row; filter to Active rows (col 17 === 'Active')
  const rows=allRows.slice(1).filter(r=>r.length>=18&&String(r[17]).trim().toLowerCase()==='active');
  const OR={},AR={},YD={};
  const TSKEYS=['Exchange','Study Abroad','Dual Degree','Transfer','iDegree'];
  const TS={};
  TSKEYS.forEach(k=>{TS[k]={regions:[],region_campus:{},by_region:{},direction:{},country_dir:{}};});
  const SR=[];const unames=new Set();

  for(const r of rows){
    const reg=r[9].trim()||'Unknown';
    const co=r[8].trim()||'Unknown';
    const raw=r[13].trim();
    const campus=normCampus(r[12]);
    if(!campus)continue;
    const ty=normType(raw);
    const dir=normDir(raw);
    const sy=r[5].trim();
    const sd=r[4].trim();
    const ed=r[6].trim();
    const ey=r[7].trim();
    unames.add(r[1].trim());

    // OR
    if(!OR[reg])OR[reg]={};
    if(!OR[reg][ty])OR[reg][ty]={};
    inc(OR[reg][ty],campus);

    // AR
    if(!AR[reg])AR[reg]={total:0,campus_total:{},countries:{},types:{}};
    AR[reg].total++;
    inc(AR[reg].campus_total,campus);
    if(!AR[reg].countries[co])AR[reg].countries[co]={};
    inc(AR[reg].countries[co],campus);
    if(!AR[reg].types[ty])AR[reg].types[ty]={};
    inc(AR[reg].types[ty],campus);

    // YD
    if(['2024','2025','2026'].includes(sy)){
      if(!YD[sy])YD[sy]={};
      if(!YD[sy][ty])YD[sy][ty]={};
      inc(YD[sy][ty],campus);
    }

    // TS
    if(TS[ty]){
      const ts=TS[ty];
      if(!ts.region_campus[reg])ts.region_campus[reg]={};
      inc(ts.region_campus[reg],campus);
      if(!ts.by_region[reg])ts.by_region[reg]={};
      if(!ts.by_region[reg][co])ts.by_region[reg][co]={};
      inc(ts.by_region[reg][co],campus);
      if(['Dual Degree','Transfer','iDegree'].includes(ty)){
        if(!ts.direction[reg])ts.direction[reg]={};
        inc(ts.direction[reg],dir);
        if(!ts.country_dir[reg])ts.country_dir[reg]={};
        if(!ts.country_dir[reg][co])ts.country_dir[reg][co]={};
        inc(ts.country_dir[reg][co],dir);
      }
    }

    SR.push({n:r[1].trim(),co,rg:reg,ca:campus,ty,mr:raw,sd,sy,ed,ey,ec:normExp(ed)});
  }

  // Sort AR by total, sort countries by total
  const ARs={};
  Object.entries(AR).sort((a,b)=>b[1].total-a[1].total).forEach(([k,v])=>{
    v.countries=Object.fromEntries(Object.entries(v.countries).sort((a,b)=>ctObj(b[1])-ctObj(a[1])));
    ARs[k]=v;
  });

  // Sort TS regions
  TSKEYS.forEach(k=>{
    const ts=TS[k];
    ts.regions=Object.keys(ts.region_campus).sort((a,b)=>ctObj(ts.region_campus[b])-ctObj(ts.region_campus[a]));
    Object.keys(ts.by_region).forEach(reg=>{
      ts.by_region[reg]=Object.fromEntries(Object.entries(ts.by_region[reg]).sort((a,b)=>ctObj(b[1])-ctObj(a[1])));
    });
  });

  return{OR,AR:ARs,YD,TS,SR,uniqueCount:unames.size};
}

function showLoader(msg){
  let ov=document.getElementById('_lov');
  if(!ov){
    ov=document.createElement('div');
    ov.id='_lov';
    Object.assign(ov.style,{position:'fixed',inset:'0',background:'var(--bg)',zIndex:'9999',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'16px'});
    ov.innerHTML=`<div style="font-family:'Cabinet Grotesk',sans-serif;font-size:1.4rem;font-weight:700" id="_lovMsg"></div><div style="font-size:13px;color:#7a7368" id="_lovSub"></div><div style="width:260px;height:4px;background:#e2ddd5;border-radius:2px;overflow:hidden"><div id="_lovBar" style="height:100%;width:5%;background:var(--active);border-radius:2px;transition:width .4s"></div></div>`;
    document.body.prepend(ov);
  }
  document.getElementById('_lovMsg').textContent=msg||'Loading…';
  return ov;
}

}

/* ── AUTO-SYNC (Apps Script) ── */
let DATA_SOURCE='', DATA_HASH='', LAST_SYNC_AT=0, SYNC_OK=true, POLL_BUSY=false, PENDING=null;
function apiConfigured(){return LIVE_API_URL && !LIVE_API_URL.startsWith('PASTE_')}
async function apiGet(action){
  const r=await fetch(LIVE_API_URL+(LIVE_API_URL.includes('?')?'&':'?')+'action='+action+'&t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
  const d=await r.json();
  if(!d||!d.ok)throw new Error((d&&d.error)||'bad response');
  return d;
}
function applyValues(d){
  if(!Array.isArray(d.values)||d.values.length<10)throw new Error('sheet returned too few rows');
  const data=crunch(d.values);
  boot(data);
  DATA_SOURCE='api';DATA_HASH=d.dataHash||'';LAST_SYNC_AT=Date.now();SYNC_OK=true;
  setBanner('live',data.SR.length);
}
const BUSY_PAGES=['search','report'];   // pages where a rebuild would wipe what the user typed
async function pollLive(force){
  if(!apiConfigured()||POLL_BUSY||(document.hidden&&!force))return;
  POLL_BUSY=true;
  try{
    const v=await apiGet('version');
    if(v.dataHash!==DATA_HASH){
      const d=await apiGet('full');
      if(BUSY_PAGES.includes(curPage)&&!force){PENDING=d}
      else{PENDING=null;applyValues(d)}
    }
    SYNC_OK=true;LAST_SYNC_AT=Date.now();
  }catch(e){console.warn('sync failed',e);SYNC_OK=false}
  finally{POLL_BUSY=false;updateSyncPill()}
}
function applyPending(){if(PENDING){const d=PENDING;PENDING=null;try{applyValues(d)}catch(e){console.warn(e)}updateSyncPill()}}
function updateSyncPill(){
  const el=document.getElementById('syncPill');if(!el)return;
  if(!apiConfigured()){el.style.display='none';return}
  el.style.display='inline-flex';
  const secs=LAST_SYNC_AT?Math.max(0,Math.round((Date.now()-LAST_SYNC_AT)/1000)):null;
  const ago=secs===null?'':secs<60?`${secs}s ago`:`${Math.round(secs/60)} min ago`;
  let state,text;
  if(!SYNC_OK){state='bad';text='Sync lost · Retry'}
  else if(PENDING){state='warn';text='New data · Click to update'}
  else if(DATA_SOURCE!=='api'){state='warn';text='Snapshot data · Retry'}
  else{state='ok';text='Live sync · '+ago}
  el.dataset.state=state;el.querySelector('span:last-child').textContent=text;
}
setInterval(()=>pollLive(),POLL_MS);
setInterval(updateSyncPill,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive(true)});
window.addEventListener('online',()=>pollLive(true));
function syncPillClick(){if(PENDING)applyPending();else pollLive(true)}

async function tryLive(){
  showLoader('Fetching live data…');
  if(apiConfigured()){
    try{
      setProgress(30,'Connecting to Google Sheets');
      const d=await apiGet('full');
      setProgress(80,'Rendering…');
      applyValues(d);setProgress(100);hideLoader();updateSyncPill();return;
    }catch(e){console.warn('Apps Script failed, trying proxies:',e.message);SYNC_OK=false}
  }
  setProgress(10,'Connecting to Google Sheets');
  for(const proxy of PROXIES){
    try{
      setProgress(25,`Trying ${proxy.includes('corsproxy')?'corsproxy.io':'allorigins'}…`);
      const url=proxy+encodeURIComponent(SHEET_URL);
      const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
      if(!r.ok)continue;
      const txt=await r.text();
      if(!txt||txt.length<200)continue;
      setProgress(55,'Parsing CSV…');
      const parsed=csvParse(txt);
      if(parsed.length<10)continue;
      setProgress(75,'Crunching data…');
      const data=crunch(parsed);
      setProgress(95,'Rendering…');
      boot(data);
      DATA_SOURCE='proxy';
      setBanner('live',data.SR.length);
      setProgress(100);
      hideLoader();
      return;
    }catch(e){console.warn('Proxy failed:',e.message);}
  }
  // All proxies failed — use embedded
  setProgress(90,'Using snapshot data…');
  boot(_EMBEDDED);
  DATA_SOURCE='snapshot';
  setBanner('snapshot',_EMBEDDED.SR.length);
  updateSyncPill();
  setProgress(100);
  hideLoader();
}

/* ── CONSTANTS ── */
const CC={SolBridge:'#1a56db',Woosong:'#0f9b6e','Main Campus':'#c85a0a'};
const TYPES=['Exchange','General','Dual Degree','Study Abroad','Transfer','iDegree','Other'];
const TC={Exchange:'#1a56db',General:'#0f9b6e','Dual Degree':'#c85a0a','Study Abroad':'#9333ea',Transfer:'#0891b2',iDegree:'#db1a56',Other:'#7a7368'};
const DC={Inbound:'dir-in',Outbound:'dir-out',Reciprocal:'dir-rec',Unspecified:'dir-uns'};
const BO={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
const GR={color:'rgba(0,0,0,0.06)'};const TK={color:'#7a7368',font:{size:11}};

const ct=o=>CS.reduce((s,k)=>s+(o&&o[k]||0),0);
const pct=(n,t)=>t?Math.round(n/t*100):0;
const sumAll=types=>Object.values(types).reduce((s,cs)=>s+ct(cs),0);

let _OR,_AR,_YD,_TS,_SR;
let _charts=[];

function mkBar(el,labels,datasets,opts){
  // Destroy any existing chart on this canvas to prevent "Canvas already in use" warnings
  const existing=Chart.getChart(el);
  if(existing)existing.destroy();
  const c=new Chart(el,{type:'bar',data:{labels,datasets},options:{...BO,...opts,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}}}});
  _charts.push(c);return c;
}
function statBd(o){return CS.filter(k=>o[k]).map(k=>`<span class="bdi" style="color:${CC[k]}"><span>${k}</span><span>${o[k]}</span></span>`).join('');}
function campRows(o,total){return CS.filter(k=>o[k]).map(k=>`<div class="cr" style="border-left:3px solid ${CC[k]}"><div style="width:8px;height:8px;border-radius:50%;background:${CC[k]}"></div><div class="cn">${k}</div><div><div class="cv" style="color:${CC[k]}">${o[k]}</div><div class="cp">${pct(o[k],total)}%</div></div></div>`).join('');}
function dirBadge(d,n){return`<span class="dir-badge ${DC[d]||'dir-uns'}">${d} <strong>${n}</strong></span>`;}

const PAGES=[
  {id:'overview',label:'Overview'},
  {id:'regions',label:'By Region'},
  {id:'exchange',label:'Exchange'},
  {id:'study',label:'Study Abroad'},
  {id:'dual',label:'Dual Degree'},
  {id:'transfer',label:'Transfer'},
  {id:'idegree',label:'iDegree'},
  {id:'years',label:'Signed Year'},
  {id:'search',label:'Search'},
  {id:'report',label:'📄 Report Generator'}
];
let curPage='overview';

function boot({OR,AR,YD,TS,SR,uniqueCount,totalDocs}){
  _OR=OR;_AR=AR;_YD=YD;_TS=TS;_SR=SR;
  document.getElementById('uniqueNum').textContent=uniqueCount;
  document.getElementById('totalActive').textContent=totalDocs||SR.length;
  buildNav();buildPages();
  buildOverview();buildRPage();
  buildTypePage('exchange','Exchange',false);
  buildTypePage('study','Study Abroad',false);
  buildTypePage('dual','Dual Degree',true);
  buildTypePage('transfer','Transfer',true);
  buildTypePage('idegree','iDegree',true);
  buildYPage();buildSearchPage();buildReportPage();
}

function buildNav(){
  const nav=document.getElementById('mainNav');nav.innerHTML='';
  const nbMap={
    exchange:sumAll(Object.fromEntries(Object.entries(_OR).map(([r,t])=>[r,t.Exchange||{}]))),
    study:sumAll(Object.fromEntries(Object.entries(_OR).map(([r,t])=>[r,t['Study Abroad']||{}]))),
    dual:sumAll(Object.fromEntries(Object.entries(_OR).map(([r,t])=>[r,t['Dual Degree']||{}]))),
    transfer:sumAll(Object.fromEntries(Object.entries(_OR).map(([r,t])=>[r,t.Transfer||{}]))),
    idegree:sumAll(Object.fromEntries(Object.entries(_OR).map(([r,t])=>[r,t.iDegree||{}])))
  };
  PAGES.forEach(p=>{
    const b=document.createElement('button');
    b.className='nav-btn'+(p.id===curPage?' active':'');
    b.dataset.page=p.id;
    const nb=nbMap[p.id]?`<span class="nb">${nbMap[p.id]}</span>`:'';
    b.innerHTML=p.label+nb;
    b.onclick=()=>switchPage(p.id);
    nav.appendChild(b);
  });
}
function buildPages(){
  const wrap=document.getElementById('pages');wrap.innerHTML='';
  PAGES.forEach(p=>{
    const d=document.createElement('div');
    d.className='page'+(p.id===curPage?' active':'');
    d.id='page-'+p.id;wrap.appendChild(d);
  });
}
function switchPage(id){
  curPage=id;
  if(PENDING&&!BUSY_PAGES.includes(id)){setTimeout(applyPending,0);}
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+id));
}

/* OVERVIEW */
function buildOverview(){
  const regs=Object.entries(_OR).map(([r,t])=>[r,sumAll(t)]).sort((a,b)=>b[1]-a[1]);
  const grand=regs.reduce((s,[,v])=>s+v,0);
  const cg={};
  Object.values(_OR).forEach(t=>Object.values(t).forEach(cs=>CS.forEach(k=>{if(cs[k])cg[k]=(cg[k]||0)+cs[k];})));
  const el=document.getElementById('page-overview');
  el.innerHTML=`<div class="section"><div class="sec-hdr"><h2>Overview</h2><span class="sub">All active documents by region &amp; type</span></div><div class="stat-row" id="ovStats"></div><div class="two-col"><div class="card"><div class="ctitle">Active documents by region &amp; campus</div><div style="position:relative;width:100%;height:460px"><canvas id="ovReg"></canvas></div></div><div class="card"><div class="ctitle">Active documents by type &amp; campus</div><div class="cw-lg"><canvas id="ovType"></canvas></div></div></div></div>`;
  document.getElementById('ovStats').innerHTML=
    `<div class="stat"><div class="lbl">Total active</div><div class="val" style="color:var(--active)">${grand}</div><div class="bd">${statBd(cg)}</div></div>`+
    TYPES.map(t=>{
      const cs={};Object.values(_OR).forEach(tr=>{const m=tr[t]||{};CS.forEach(k=>{if(m[k])cs[k]=(cs[k]||0)+m[k];});});
      const tot=ct(cs);if(!tot)return'';
      return`<div class="stat"><div class="lbl">${t}</div><div class="val" style="color:${TC[t]}">${tot}</div><div class="bd">${statBd(cs)}</div></div>`;
    }).join('');
  const rl=regs.map(([r])=>r);
  mkBar(document.getElementById('ovReg'),rl,CS.map(c=>({label:c,data:regs.map(([r])=>Object.values(_OR[r]).reduce((s,cs)=>s+(cs[c]||0),0)),backgroundColor:CC[c],borderWidth:0,borderRadius:2})),{indexAxis:'y',scales:{x:{stacked:true,grid:GR,ticks:TK},y:{stacked:true,grid:{display:false},ticks:{color:'#1a1814',font:{size:11}}}}});
  mkBar(document.getElementById('ovType'),TYPES,CS.map(c=>({label:c,data:TYPES.map(t=>{const cs={};Object.values(_OR).forEach(tr=>{const m=tr[t]||{};CS.forEach(k=>{if(m[k])cs[k]=(cs[k]||0)+m[k];});});return cs[c]||0;}),backgroundColor:CC[c],borderWidth:0,borderRadius:2})),{scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#1a1814',font:{size:12}}},y:{stacked:true,grid:GR,ticks:TK,beginAtZero:true}}});
}

/* REGION */
let rChart=null,curR='';
function buildRPage(){
  const el=document.getElementById('page-regions');
  el.innerHTML=`<div class="section"><div class="sec-hdr"><h2>Breakdown by region</h2><span class="sub">Active MOUs — top countries, types &amp; campus split</span></div><div class="tab-strip" id="rTabs"></div><div id="rDetail"></div></div>`;
  curR=Object.keys(_AR)[0];
  const strip=document.getElementById('rTabs');
  Object.entries(_AR).forEach(([r,d])=>{
    const b=document.createElement('button');
    b.className='tab'+(r===curR?' active':'');
    b.innerHTML=`${r}<span class="tc">${d.total}</span>`;
    b.onclick=()=>{document.querySelectorAll('#rTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');curR=r;renderR(r);};
    strip.appendChild(b);
  });
  renderR(curR);
}
function renderR(region){
  if(rChart){try{rChart.destroy();}catch(e){}rChart=null;}
  const d=_AR[region];
  const countries=Object.entries(d.countries).slice(0,10);
  const maxC=Math.max(1,...countries.map(([,cs])=>ct(cs)));
  const typeE=TYPES.filter(t=>d.types[t]).map(t=>({t,tot:ct(d.types[t]),cs:d.types[t]})).sort((a,b)=>b.tot-a.tot);
  document.getElementById('rDetail').innerHTML=`
    <div class="rg">
      <div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">Campus split</div>
        ${campRows(d.campus_total,d.total)}
        <div style="margin-top:1.25rem">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px">By type</div>
          ${typeE.map(({t,tot,cs})=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:${TC[t]};font-weight:600">${t}</span><span style="font-weight:700;font-family:'Cabinet Grotesk',sans-serif">${tot}</span></div><div style="display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--border)">${CS.filter(k=>cs[k]).map(k=>`<div style="width:${pct(cs[k],tot)}%;background:${CC[k]};min-width:2px"></div>`).join('')}</div><div style="display:flex;gap:6px;margin-top:3px">${CS.filter(k=>cs[k]).map(k=>`<span style="font-size:10px;color:${CC[k]};font-weight:600">${cs[k]}</span>`).join('')}</div></div>`).join('')}
        </div>
      </div>
      <div class="card"><div class="ctitle">Top countries</div>${countries.map(([c,cs])=>`<div class="ctry-row"><span class="ctry-nm">${c}</span><div class="ctry-bars">${CS.filter(k=>cs[k]).map(k=>`<div class="cbs" style="width:${Math.round(cs[k]/maxC*80)}px;background:${CC[k]}" title="${k}: ${cs[k]}"></div>`).join('')}</div><span class="ctry-tot">${ct(cs)}</span></div>`).join('')}</div>
      <div class="card"><div class="ctitle">Type &amp; campus distribution</div><div class="cw"><canvas id="rTypeChart"></canvas></div><div class="leg">${typeE.map(({t})=>`<span class="li"><span class="ld" style="background:${TC[t]}"></span>${t}</span>`).join('')}<div style="width:100%;border-top:1px solid var(--border);margin:5px 0"></div>${CS.map(k=>`<span class="li"><span class="ld" style="background:${CC[k]};border-radius:50%"></span>${k}</span>`).join('')}</div></div>
    </div>`;
  rChart=mkBar(document.getElementById('rTypeChart'),typeE.map(e=>e.t),CS.map(c=>({label:c,data:typeE.map(e=>e.cs[c]||0),backgroundColor:CC[c],borderWidth:0,borderRadius:3})),{scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#1a1814',font:{size:11}}},y:{stacked:true,grid:GR,ticks:TK,beginAtZero:true}}});
}

/* TYPE PAGES */
const typeCurR={};const typeCharts={};
function buildTypePage(pageId,typeName,hasDir){
  const el=document.getElementById('page-'+pageId);
  const data=_TS[typeName];const regions=data.regions;
  if(!regions||!regions.length){el.innerHTML=`<div class="section"><p style="color:var(--muted);padding:2rem">No data for ${typeName}</p></div>`;return;}
  const grandTotal=regions.reduce((s,r)=>s+ct(data.region_campus[r]),0);
  const campGrand={};
  regions.forEach(r=>CS.forEach(k=>{if(data.region_campus[r]&&data.region_campus[r][k])campGrand[k]=(campGrand[k]||0)+data.region_campus[r][k];}));
  typeCurR[pageId]=regions[0];
  const maxR=Math.max(1,...regions.map(r=>ct(data.region_campus[r])));
  const regH=Math.max(280,regions.length*44+80);
  el.innerHTML=`<div class="section">
    <div class="sec-hdr"><h2>${typeName} agreements</h2><span class="sub">Active ${typeName} MOUs — ${grandTotal} total</span></div>
    <div class="stat-row" id="${pageId}-stats"></div>
    <div class="two-col" style="margin-bottom:1.5rem">
      <div class="card"><div class="ctitle">By region &amp; campus</div><div style="position:relative;width:100%;height:${regH}px"><canvas id="${pageId}-regChart"></canvas></div></div>
      ${hasDir?`<div class="card"><div class="ctitle">Direction totals across all regions</div><div id="${pageId}-dirAll"></div></div>`:'<div></div>'}
    </div>
    <div class="sec-hdr" style="margin-bottom:.75rem"><h2 style="font-size:1rem">By region — top countries</h2><span class="sub">Click a region to explore</span></div>
    <div class="type-layout"><div class="region-list-card" id="${pageId}-rl"></div><div class="type-detail-panel" id="${pageId}-detail"></div></div>
  </div>`;
  document.getElementById(`${pageId}-stats`).innerHTML=
    `<div class="stat"><div class="lbl">Total</div><div class="val" style="color:${TC[typeName]||'#333'}">${grandTotal}</div><div class="bd">${statBd(campGrand)}</div></div>`+
    regions.map(r=>{const tot=ct(data.region_campus[r]);return`<div class="stat"><div class="lbl">${r}</div><div class="val" style="color:${TC[typeName]||'#333'}">${tot}</div><div class="bd">${statBd(data.region_campus[r])}</div></div>`;}).join('');
  mkBar(document.getElementById(`${pageId}-regChart`),regions,CS.map(c=>({label:c,data:regions.map(r=>(data.region_campus[r]&&data.region_campus[r][c])||0),backgroundColor:CC[c],borderWidth:0,borderRadius:2})),{indexAxis:'y',scales:{x:{stacked:true,grid:GR,ticks:TK},y:{stacked:true,grid:{display:false},ticks:{color:'#1a1814',font:{size:11}}}}});
  if(hasDir){
    const dT={};
    regions.forEach(r=>Object.entries(data.direction[r]||{}).forEach(([d,n])=>{dT[d]=(dT[d]||0)+n;}));
    document.getElementById(`${pageId}-dirAll`).innerHTML=
      `<div style="display:flex;flex-wrap:wrap;gap:10px;padding-top:4px">${Object.entries(dT).map(([d,n])=>dirBadge(d,n)).join('')}</div>`+
      `<div style="margin-top:1.5rem;font-size:12px;color:var(--muted);margin-bottom:.5rem">Direction per region</div>`+
      regions.filter(r=>data.direction[r]).map(r=>`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">${r}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(data.direction[r]).map(([d,n])=>dirBadge(d,n)).join('')}</div></div>`).join('');
  }
  const rl=document.getElementById(`${pageId}-rl`);
  regions.forEach(r=>{
    const n=ct(data.region_campus[r]);
    const row=document.createElement('div');
    row.className='rl-row'+(r===typeCurR[pageId]?' active':'');
    row.innerHTML=`<span class="rl-name">${r}</span><div class="rl-bar-wrap"><div class="rl-bar" style="width:${Math.round(n/maxR*100)}%;background:${TC[typeName]||'#333'}"></div></div><span class="rl-n">${n}</span>`;
    row.onclick=()=>{document.querySelectorAll(`#${pageId}-rl .rl-row`).forEach(x=>x.classList.remove('active'));row.classList.add('active');typeCurR[pageId]=r;renderTypeDet(pageId,typeName,r,hasDir);};
    rl.appendChild(row);
  });
  renderTypeDet(pageId,typeName,regions[0],hasDir);
}
function renderTypeDet(pageId,typeName,region,hasDir){
  if(typeCharts[pageId]){try{typeCharts[pageId].destroy();}catch(e){}delete typeCharts[pageId];}
  const data=_TS[typeName];
  const countries=Object.entries(data.by_region[region]||{});
  const maxC=Math.max(1,...countries.map(([,cs])=>ct(cs)));
  const regTotal=ct(data.region_campus[region]||{});
  const dirsByR=hasDir?(data.direction[region]||{}):{};
  const cDir=hasDir?(data.country_dir[region]||{}):{};
  document.getElementById(`${pageId}-detail`).innerHTML=`
    <div class="type-detail-inner">
      <div class="card">
        <div class="ctitle">${region} — campus split</div>
        ${campRows(data.region_campus[region]||{},regTotal)}
        ${hasDir&&Object.keys(dirsByR).length?`<div style="margin-top:1rem"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">Direction</div><div style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(dirsByR).map(([d,n])=>dirBadge(d,n)).join('')}</div></div>`:''}
        <div style="margin-top:1.25rem"><div class="ctitle">By campus chart</div><div class="cw-sm"><canvas id="${pageId}-detChart"></canvas></div></div>
      </div>
      <div class="card"><div class="ctitle">Top countries</div>${countries.map(([c,cs])=>{
        const tot=ct(cs);const dirs=cDir[c];
        return`<div class="ctry-row" style="${dirs?'flex-wrap:wrap;height:auto;padding:6px 0':''}"><span class="ctry-nm">${c}</span><div class="ctry-bars">${CS.filter(k=>cs[k]).map(k=>`<div class="cbs" style="width:${Math.round(cs[k]/maxC*80)}px;background:${CC[k]}" title="${k}: ${cs[k]}"></div>`).join('')}</div><span class="ctry-tot">${tot}</span>${dirs?`<div style="width:100%;padding-top:4px;display:flex;gap:5px;flex-wrap:wrap">${Object.entries(dirs).map(([d,n])=>dirBadge(d,n)).join('')}</div>`:''}</div>`;
      }).join('')}</div>
    </div>`;
  const campD=CS.filter(k=>data.region_campus[region]&&data.region_campus[region][k]).map(k=>({k,v:data.region_campus[region][k]}));

function buildSearchPage(){

function doSearch(){
  const name=(document.getElementById('sq-name')||{}).value?.toLowerCase()||'';
  const campus=(document.getElementById('sq-campus')||{}).value||'';
  const type=(document.getElementById('sq-type')||{}).value||'';
  const country=(document.getElementById('sq-country')||{}).value?.toLowerCase()||'';
  const region=(document.getElementById('sq-region')||{}).value||'';
  const syFrom=parseInt((document.getElementById('sq-sy-from')||{}).value)||0;
  const syTo=parseInt((document.getElementById('sq-sy-to')||{}).value)||9999;
  const expFilter=(document.getElementById('sq-exp')||{}).value||'';
  ss.results=_SR.filter(r=>{
    if(name&&!r.n.toLowerCase().includes(name))return false;
    if(campus&&r.ca!==campus)return false;
    if(type&&r.ty!==type)return false;
    if(country&&!r.co.toLowerCase().includes(country))return false;
    if(region&&r.rg!==region)return false;
    const sy=parseInt(r.sy)||0;
    if(syFrom&&sy&&sy<syFrom)return false;
    if(syTo<9999&&sy&&sy>syTo)return false;
    if(expFilter==='indefinite'&&r.ec!=='Indefinite')return false;
    if(expFilter==='ongoing'&&r.ec!=='Ongoing')return false;
    return true;
  });
  ss.page=1;renderResults();
}
function setSort(key){if(ss.sortKey===key)ss.sortDir*=-1;else{ss.sortKey=key;ss.sortDir=1;}renderResults();}
function clearSearch(){['sq-name','sq-campus','sq-type','sq-country','sq-region','sq-sy-from','sq-sy-to','sq-exp'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});doSearch();}
function renderResults(){
  const{results,page,perPage,sortKey,sortDir}=ss;
  const sorted=[...results].sort((a,b)=>{const av=(a[sortKey]||'').toString().toLowerCase(),bv=(b[sortKey]||'').toString().toLowerCase();return av<bv?-sortDir:av>bv?sortDir:0;});
  const total=sorted.length,totalPages=Math.max(1,Math.ceil(total/perPage));
  const curPage=Math.min(page,totalPages);
  const slice=sorted.slice((curPage-1)*perPage,curPage*perPage);
  ['n','co','rg','ca','ty','ec','sy','ed'].forEach(k=>{const e=document.getElementById('sa-'+k);if(e)e.textContent=k===ss.sortKey?(ss.sortDir===1?'↑':'↓'):'';});
  document.getElementById('sq-meta').innerHTML=`<span>Showing <strong>${slice.length}</strong> of <strong>${total}</strong> results</span><span style="font-size:12px">Page ${curPage} of ${totalPages}</span>`;
  const body=document.getElementById('sq-body');
  if(!slice.length){body.innerHTML=`<tr><td colspan="8"><div class="no-results">No results</div></td></tr>`;return;}
  body.innerHTML=slice.map(r=>{
    const tc=TC[r.ty]||'#7a7368',cc=CC[r.ca]||'#7a7368';
    const sd=r.sd&&!['No Date','No date given'].includes(r.sd)?r.sd:(r.sy&&r.sy!=='NA'?r.sy:'—');
    const mrD=r.mr&&r.mr!==r.ty?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${r.mr}</div>`:'';
    const ecC=r.ec==='Indefinite'?'#0891b2':'#0f9b6e';
    return`<tr><td style="font-weight:600;max-width:200px">${r.n}</td><td>${r.co}</td><td style="color:var(--muted);font-size:12px">${r.rg}</td><td><span class="camp-pill"><span class="cdot-sm" style="background:${cc}"></span><span style="color:${cc}">${r.ca}</span></span></td><td><span class="type-pill" style="background:${tc}18;color:${tc}">${r.ty}</span>${mrD}</td><td><span class="dir-badge" style="background:${ecC}18;color:${ecC}">${r.ec}</span></td><td class="date-val">${sd}</td><td class="date-val">${r.ed||'—'}</td></tr>`;
  }).join('');
  const pgWrap=document.getElementById('sq-pages');
  if(totalPages<=1){pgWrap.innerHTML='';return;}
  const pages=[];
  pages.push(`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>&#8249;</button>`);
  let lo=Math.max(1,curPage-2),hi=Math.min(totalPages,curPage+2);
  if(lo>1){pages.push(`<button class="pg-btn" onclick="goPage(1)">1</button>`);if(lo>2)pages.push(`<span style="color:var(--muted);padding:0 4px">&hellip;</span>`);}
  for(let i=lo;i<=hi;i++)pages.push(`<button class="pg-btn${i===curPage?' active':''}" onclick="goPage(${i})">${i}</button>`);
  if(hi<totalPages){if(hi<totalPages-1)pages.push(`<span style="color:var(--muted);padding:0 4px">&hellip;</span>`);pages.push(`<button class="pg-btn" onclick="goPage(${totalPages})">${totalPages}</button>`);}
  pages.push(`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===totalPages?'disabled':''}>&#8250;</button>`);
  pgWrap.innerHTML=pages.join('');
}
function goPage(p){ss.page=p;renderResults();document.getElementById('page-search').scrollIntoView({behavior:'smooth',block:'start'});}

function kpi(val, label, color) {
  return `<div class="rpt-kpi"><div class="kv" style="color:${color||'var(--text)'}">${val}</div><div class="kl">${label}</div></div>`;
}

function barRow(label, val, max, color, extra='') {
  const pct = max ? Math.round(val/max*100) : 0;
  return `<tr><td>${label}</td><td><div class="rpt-bar-cell"><div class="rpt-bar-bg"><div class="rpt-bar-fill" style="width:${pct}%;background:${color}"></div></div></div></td><td class="num">${val}</td>${extra?`<td>${extra}</td>`:''}</tr>`;
}

function expBadge(ey) {
  if (!ey || ey === 'NA' || ey === '') return `<span class="exp-badge exp-indef">Indefinite</span>`;
  const y = parseInt(ey);
  const now = new Date().getFullYear();
  if (y <= now) return `<span class="exp-badge exp-urgent">Expired ${y}</span>`;
  if (y === now + 1) return `<span class="exp-badge exp-urgent">Expires ${y}</span>`;
  if (y === now + 2) return `<span class="exp-badge exp-soon">Expires ${y}</span>`;
  return `<span class="exp-badge exp-ok">Expires ${y}</span>`;
}

function rptExecutive() {
  const rows = getFilteredSR();
  // Use OR for the top-level KPIs so numbers match the Overview tab
  const ctAll = o => CS.reduce((s,k)=>s+(o&&o[k]||0),0);
  const campTot = {SolBridge:0,Woosong:0,'Main Campus':0};
  rows.forEach(r => { if(campTot[r.ca]!==undefined) campTot[r.ca]++; });
  const total = rows.length;
  const countries = new Set(rows.map(r=>r.co)).size;
  const regionsCount = new Set(rows.map(r=>r.rg)).size;

  const byReg = {};
  rows.forEach(r => { byReg[r.rg]=(byReg[r.rg]||0)+1; });
  const topRegs = Object.entries(byReg).sort((a,b)=>b[1]-a[1]).slice(0,13);
  const maxReg = topRegs[0]?.[1]||1;

  const byType = {};
  rows.forEach(r => { byType[r.ty]=(byType[r.ty]||0)+1; });
  const sortedTypes = Object.entries(byType).sort((a,b)=>b[1]-a[1]);
  const maxType = sortedTypes[0]?.[1]||1;

  const byYear = {};
  rows.forEach(r => { if(r.sy&&r.sy.match(/^\d{4}$/)) byYear[r.sy]=(byYear[r.sy]||0)+1; });
  const maxY = Math.max(...Object.values(byYear),1);
  const recentYears = ['2026','2025','2024'].map(y => {
    const n = byYear[y]||0;
    return `<tr><td>${y}</td><td class="num">${n}</td><td><div class="rpt-bar-cell"><div class="rpt-bar-bg"><div class="rpt-bar-fill" style="width:${Math.round(n/maxY*100)}%;background:var(--active)"></div></div></div></td></tr>`;
  }).join('');

  const expSoon = rows.filter(r => r.ey && ['2025','2026'].includes(r.ey)).length;

  rptWrap('Executive Summary', `Active MOU Portfolio Overview${filterLabel()}`, `
    <div class="rpt-section">
      <div class="rpt-section-title">Portfolio at a Glance</div>
      <div class="rpt-kpi-row">
        ${kpi(total,'Total MOUs','var(--active)')}
        ${kpi(campTot.SolBridge,'SolBridge','var(--sol)')}
        ${kpi(campTot.Woosong,'Woosong','var(--woo)')}
        ${kpi(campTot['Main Campus'],'Main Campus','var(--main)')}
        ${kpi(countries,'Countries','')}
        ${kpi(regionsCount,'Regions','')}
        ${kpi(expSoon,'Expiring 2025–26','#dc2626')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
      <div class="rpt-section">
        <div class="rpt-section-title">By Region</div>
        <table class="rpt-table"><thead><tr><th>Region</th><th>Volume</th><th class="num">MOUs</th></tr></thead>
        <tbody>${topRegs.map(([r,n])=>barRow(r,n,maxReg,'#1a1814')).join('')}</tbody></table>
      </div>
      <div class="rpt-section">
        <div class="rpt-section-title">By MOU Type</div>
        <table class="rpt-table"><thead><tr><th>Type</th><th>Volume</th><th class="num">Total</th></tr></thead>
        <tbody>${sortedTypes.map(([t,n])=>barRow(t,n,maxType,TC[t]||'#999')).join('')}</tbody></table>
      </div>
    </div>
    <div class="rpt-section" style="margin-top:1.5rem">
      <div class="rpt-section-title">By Signed Year</div>
      <table class="rpt-table" style="max-width:360px">
        <thead><tr><th>Year</th><th class="num">Count</th><th>Trend</th></tr></thead>
        <tbody>${recentYears}</tbody>
      </table>
    </div>`);
}

/* ── REPORT 2: EXPIRING MOUs ── */
function rptExpiring() {
  const thru = parseInt(document.getElementById('ro-expyr')?.value || '2026');
  const now = new Date().getFullYear();
  const rows = getFilteredSR().filter(r => {
    if (!r.ey || r.ey === 'NA') return false;
    const y = parseInt(r.ey);
    return y >= now && y <= thru;
  }).sort((a,b) => (parseInt(a.ey)||9999) - (parseInt(b.ey)||9999));

  const byYear = {};
  rows.forEach(r => { byYear[r.ey] = (byYear[r.ey]||0)+1; });
  const byCampus = {SolBridge:0,Woosong:0,'Main Campus':0};
  rows.forEach(r => { if(byCampus[r.ca]!==undefined) byCampus[r.ca]++; });

  const tableRows = rows.map(r => {
    const cc = CC[r.ca]||'#999', tc = TC[r.ty]||'#999';
    return `<tr>
      <td style="font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.n}</td>
      <td>${r.co}</td>
      <td><span class="camp-pill"><span class="cdot-sm" style="background:${cc}"></span><span style="color:${cc}">${r.ca}</span></span></td>
      <td><span class="type-pill" style="background:${tc}18;color:${tc}">${r.ty}</span></td>
      <td>${expBadge(r.ey)}</td>
      <td style="font-size:11px;color:var(--muted)">${r.sd||'—'}</td>
    </tr>`;
  }).join('');

  rptWrap(`Expiring MOUs — Through ${thru}`, `${rows.length} agreements require renewal action${filterLabel()}`, `
    <div class="rpt-section">
      <div class="rpt-kpi-row">
        ${kpi(rows.length,'Agreements Expiring','#dc2626')}
        ${Object.entries(byYear).map(([y,n])=>kpi(n,`Expiring ${y}`,parseInt(y)<=now+1?'#dc2626':parseInt(y)===now+2?'#ca8a04':'var(--woo)')).join('')}
        ${kpi(byCampus.SolBridge,'SolBridge','var(--sol)')}
        ${kpi(byCampus.Woosong,'Woosong','var(--woo)')}
        ${kpi(byCampus['Main Campus'],'Main Campus','var(--main)')}
      </div>
    </div>
    <div class="rpt-section">
      <div class="rpt-section-title">Expiring Agreement Details</div>
      ${rows.length ? `<div style="overflow-x:auto"><table class="rpt-table">
        <thead><tr><th>Institution</th><th>Country</th><th>Campus</th><th>Type</th><th>Status</th><th>Signed</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : '<div class="rpt-empty">No agreements expiring in this period.</div>'}
    </div>`, rows);
}

  const byRegion = {};

  const sortedReg = Object.entries(byRegion).sort((a,b)=>b[1]-a[1]);

    byCountry[r.co] = byCountry[r.co]||{}; byCountry[r.co][r.ca] = (byCountry[r.co][r.ca]||0)+1;

      <td style="font-weight:600">${r.n}</td>

      <td>${expBadge(r.ey)}</td>

  }).join('');

  rptWrap(`${reg} — Regional Partnership Report`, `${rows.length} MOUs · ${sortedCountries.length} countries${filterLabel()}`, `
    <div class="rpt-section">
      <div class="rpt-kpi-row">
        ${kpi(rows.length,'Total MOUs','var(--active)')}

      <div class="rpt-section">
        <div class="rpt-section-title">Top Countries</div>
        <table class="rpt-table"><thead><tr><th>Country</th><th>Volume</th><th class="num">MOUs</th></tr></thead>
        <tbody>${sortedCountries.slice(0,12).map(([c,cs])=>barRow(c,ctF(cs),maxC,'#1a1814')).join('')}</tbody></table>

        <div class="rpt-section-title">By MOU Type</div>

        <tbody>${Object.entries(byType).sort((a,b)=>ctF(b[1])-ctF(a[1])).map(([t,cs])=>barRow(t,ctF(cs),rows.length,TC[t]||'#999')).join('')}</tbody></table>
      </div>
    </div>
    <div class="rpt-section">
      <div class="rpt-section-title">Full Partnership List (${rows.length} MOUs)</div>
      ${rows.length ? `<div style="overflow-x:auto"><table class="rpt-table">
        <thead><tr><th>Institution</th><th>Country</th><th>Campus</th><th>Type</th><th>Signed</th><th>Expiry</th></tr></thead>
        <tbody>${tableRows}</tbody>

}

/* ── REPORT 5: MOU TYPE ANALYSIS ── */
function rptType() {
  const base = getFilteredSR();
  const sections = TYPES.map(ty => {
    const rows = base.filter(r=>r.ty===ty);
    if (!rows.length) return '';
    const byRegion = {};
    rows.forEach(r=>{byRegion[r.rg]=(byRegion[r.rg]||0)+1;});
    const sortedR = Object.entries(byRegion).sort((a,b)=>b[1]-a[1]);
    const maxR = sortedR[0]?.[1]||1;
    const byCampus = {};
    CS.forEach(c=>{byCampus[c]=rows.filter(r=>r.ca===c).length;});
    return `<div class="rpt-section">
      <div class="rpt-section-title" style="color:${TC[ty]||'var(--muted)'}">${ty} — ${rows.length} active agreements</div>
      <div class="rpt-kpi-row">
        ${CS.map(c=>byCampus[c]?kpi(byCampus[c],c,CC[c]):'').join('')}
        ${kpi(new Set(rows.map(r=>r.co)).size,'Countries','')}
      </div>
      <table class="rpt-table" style="max-width:500px">
        <thead><tr><th>Region</th><th>Volume</th><th class="num">MOUs</th></tr></thead>
        <tbody>${sortedR.map(([r,n])=>barRow(r,n,maxR,TC[ty]||'#999')).join('')}</tbody>
      </table>
    </div>`;
  }).join('');
  rptWrap('MOU Type Analysis', `Breakdown of active agreement types${filterLabel()}`, sections||'<div class="rpt-empty">No agreements match the current filters.</div>');
}

/* ── PRINT REPORT ── */
function printReport() {
  const preview = document.getElementById('rptPreview');
  if (!preview || preview.querySelector('.rpt-empty')) {
    alert('Please generate a report first.');
    return;
  }
  const content = preview.innerHTML;

  // Remove any previous print frame
  const old = document.getElementById('_printFrame');
  if (old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.id = '_printFrame';
  iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none';
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;font-size:12px;color:#1a1814;background:#fff;padding:24px}
    h3{font-size:16px;font-weight:800;margin-bottom:4px}
    .rph-meta{font-size:11px;color:#7a7368;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #1a1814}
    .rpt-body{margin-top:12px}
    .rpt-section{margin-bottom:20px}
    .rpt-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a7368;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #e2ddd5}
    .rpt-kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .rpt-kpi{flex:1;min-width:80px;background:#f0ede6;border-radius:5px;padding:8px 10px}
    .rpt-kpi .kv{font-size:22px;font-weight:800;line-height:1}
    .rpt-kpi .kl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7a7368;margin-top:3px}
    table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
    th{background:#f0ede6;padding:5px 8px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7a7368;font-weight:700;border-bottom:1.5px solid #e2ddd5}
    td{padding:5px 8px;border-bottom:1px solid #e2ddd5;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .num{font-weight:700;text-align:right}
    .rpt-bar-cell{display:flex;align-items:center;gap:5px}
    .rpt-bar-bg{flex:1;height:5px;background:#e2ddd5;border-radius:2px;overflow:hidden;min-width:40px}
    .rpt-bar-fill{height:100%;border-radius:2px}
    .rpt-preview-hdr{margin-bottom:12px}
    .exp-badge,.type-pill,.camp-pill,.dir-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
    .exp-urgent{background:#fecaca;color:#dc2626}
    .exp-soon{background:#fef08a;color:#ca8a04}
    .exp-ok{background:#bbf7d0;color:#16a34a}
    .exp-indef{background:#bae6fd;color:#0891b2}
    .cdot-sm{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
    div[style*="grid-template-columns"]{display:block}
    div[style*="display:grid"]{display:block}
  </style>
  </head><body>${content}</body></html>`);
  doc.close();

  iframe.onload = function() {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  };
}
